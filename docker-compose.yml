version: '3.8'

services:
  # Serviço 1: Interface Web & API (Next.js 15 Standalone)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: capital_control_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Serviço 2: Bot WhatsApp (Baileys WebSocket Leve)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: capital_control_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WHATSAPP_AUTH_FOLDER=/app/auth_info_baileys
    volumes:
      # Persistência estrita da sessão e QR Code entre reinicializações
      - ./auth_info_baileys:/app/auth_info_baileys
    # Limitação estrita de memória a 150 MB para proteção dos 8GB de RAM do servidor
    mem_limit: 150m
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 64M
    depends_on:
      web:
        condition: service_started

volumes:
  auth_info_baileys:
    driver: local
